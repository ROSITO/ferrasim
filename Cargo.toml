[workspace]
members = [
    "crates/model",
    "crates/mesh",
    "crates/fem",
    "crates/solvers",
    "crates/io",
    "apps/ferrasim-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/ROSITO/ferrasim"
publish = false

[workspace.dependencies]
ferrasim-model = { path = "crates/model" }
ferrasim-mesh = { path = "crates/mesh" }
ferrasim-fem = { path = "crates/fem" }
ferrasim-solvers = { path = "crates/solvers" }
ferrasim-io = { path = "crates/io" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
nalgebra-sparse = "0.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
overflow-checks = true
