name: Rust workspace checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install project Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install schema-check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Regenerate independent dense element references
        run: python validation/generate_tet4_reference.py --check
      - name: Regenerate exact assembled patch references
        run: python validation/generate_patch_reference.py --check
      - name: Regenerate analytic load reference and input files
        run: python validation/generate_load_reference.py --check
      - name: Build release
        run: cargo build --workspace --release --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Check planning fixtures and document links
        run: python scripts/check_project.py
      - name: Check editor JSON Schema
        run: python scripts/check_model_schema.py
      - name: Inspect reference model through Rust API
        run: cargo run -p ferrasim-io --example inspect_model --locked -- examples/minimal/model.json
      - name: Import mesh and check model references
        run: cargo run -p ferrasim-io --example inspect_mesh --locked -- examples/minimal/model.json
      - name: Inspect local element physics
        run: cargo run -p ferrasim-cli --example inspect_element --locked -- examples/minimal/model.json
      - name: Inspect sparse assembly and prescriptions
        run: cargo run -p ferrasim-cli --example inspect_assembly --locked -- examples/minimal/model.json
      - name: Solve independent SPD reference with CG
        run: cargo run -p ferrasim-solvers --example cg_reference --locked -- spd
      - name: Check failed solver examples never announce success or write results
        run: python scripts/check_solver_failure.py
      - name: Solve explicit unit-force inspection scenario
        run: cargo run -p ferrasim-cli --example inspect_solver --locked -- examples/minimal/model.json
      - name: Solve actual minimal model loads and assess balances
        run: cargo run -p ferrasim-cli --example solve_model --locked -- examples/minimal/model.json 1 1
      - name: Solve analytic uniaxial surface-traction model
        run: cargo run -p ferrasim-cli --example solve_model --locked -- examples/uniaxial/model.json 10 2
